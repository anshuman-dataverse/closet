name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      ALLOWED_EMAIL: owner@closet.test
    steps:
      - uses: actions/checkout@v4

      # ---- worker (unit)
      - uses: astral-sh/setup-uv@v6
      - name: worker lint + types + unit tests
        working-directory: worker
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q -m "not integration"
      - name: web color and fit tables match the worker's YAML
        run: |
          (cd worker && uv run python ../scripts/export-style-data.py)
          git diff --exit-code web/lib/style/data.json web/lib/style/golden.json web/lib/domain/fits.json

      # ---- web (static)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web typecheck + lint + unit tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      # ---- database + end-to-end (local Supabase in Docker)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: database tests
        run: supabase test db
      - name: worker integration tests
        working-directory: worker
        run: uv run pytest -q -m integration
      - name: e2e
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
