# Local metasearch for deal hunts. Bound to 127.0.0.1 only: nothing is exposed to the network.
# Start: docker compose -f infra/searxng/docker-compose.yml up -d
name: closet-searxng
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      # Read from infra/searxng/.env (generated by the README step; never committed).
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run the README step to create infra/searxng/.env}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
