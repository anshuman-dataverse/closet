# SearXNG settings for Closet. Only reachable from this Mac (see docker-compose.yml).
use_default_settings: true

general:
  instance_name: "closet-local"
  enable_metrics: false

server:
  # The real secret comes from the SEARXNG_SECRET environment variable.
  secret_key: "overridden-by-env"
  limiter: false          # localhost only, single user
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json                # the worker calls /search?q=...&format=json

ui:
  query_in_title: false

# More web engines, so hunts keep working when one throttles (DuckDuckGo CAPTCHAs and Google CSE
# "too many requests" were seen on 2026-11-23). All free, no accounts.
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: yahoo
    disabled: false
