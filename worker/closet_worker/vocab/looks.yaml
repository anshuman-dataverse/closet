# Shop a look: the pieces each occasion can use, per slot, in order of preference (common
# menswear guidance). Every type must be in staples.yaml. Unless you pick one in the app, the
# worker uses the first type you own the fewest of, so a look doesn't buy what you already have.
office:
  Tops: [oxford shirt, dress shirt, knit polo, turtleneck]
  Layers: [blazer, v-neck sweater, crew neck sweater, cardigan]
  Bottoms: [dress trousers, chinos]
  Shoes: [loafers, derby shoes, chelsea boots]
  Accessories: [belt]
college:
  Tops: [oxford shirt, henley, t-shirt, polo shirt, denim shirt, flannel shirt]
  Layers: [crew neck sweater, overshirt, quarter-zip sweater, denim jacket, bomber jacket]
  Bottoms: [chinos, dark wash jeans, light wash jeans, cargo trousers]
  Shoes: [white sneakers, sneakers, chelsea boots]
party:
  Tops: [oxford shirt, knit polo, turtleneck, linen shirt]
  Layers: [blazer, bomber jacket, overshirt]
  Bottoms: [dark wash jeans, chinos, dress trousers]
  Shoes: [chelsea boots, loafers, white sneakers]
home:
  Tops: [t-shirt, henley, long-sleeve t-shirt]
  Bottoms: [joggers, shorts]
  Shoes: [sneakers, sandals]
