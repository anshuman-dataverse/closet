cool/light/low:
  best:
  - light blue
  - mint
  - navy
  - burgundy
  - teal
  - sky blue
  - purple
  - pink
  neutrals:
  - charcoal
  - navy
  - grey
  - white
  careful:
  - name: orange
    why: Warm oranges can clash with a cool undertone.
  - name: mustard
    why: Yellow-based shades can look muddy next to cool skin.
  - name: camel
    why: Warm beiges near the face can look flat; keep them on trousers.
  - name: black
    why: Pure black can overpower low contrast; charcoal or navy is softer.
