# Color palettes by undertone/depth/contrast (SPEC 5.2 step 5). Drafted from common seasonal color guidance:
# a base per undertone, richer shades for deeper coloring, black and white for high contrast.
# Names map to colors.yaml. Review and edit freely; tests check every combination stays well-formed.
warm/light/low:
  best:
  - light blue
  - mint
  - rust
  - mustard
  - olive
  - camel
  - terracotta
  - teal
  neutrals:
  - camel
  - chocolate
  - cream
  - khaki
  - navy
  careful:
  - name: lavender
    why: Cool pastels can look washed out next to warm skin.
  - name: silver
    why: Icy greys can flatten warm coloring near the face.
  - name: pink
    why: Cool pinks can fight a warm undertone.
  - name: black
    why: Pure black can overpower low contrast; charcoal or navy is softer.
