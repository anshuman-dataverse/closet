[project]
name = "closet-worker"
version = "0.1.0"
description = "Closet Mac worker: claims jobs from Supabase and runs the local models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "supabase>=2.34.1",
]

[project.scripts]
closet-worker = "closet_worker.main:cli"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["closet_worker"]

[[tool.mypy.overrides]]
module = ["supabase.*", "postgrest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Supabase stack (supabase start)"]
# The supabase client warns about its own internal use of deprecated postgrest args.
filterwarnings = ["ignore::DeprecationWarning:supabase.*"]
