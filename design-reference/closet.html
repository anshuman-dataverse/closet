<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6EBF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131C" media="(prefers-color-scheme: dark)">
<title>Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#E6EBF1; --card:#FFFFFF; --sunk:#D5DCE6; --ink:#1A2142; --ink-2:#525C76; --line:#C3CCD8;
  --chalk:#F4C430; --chalk-ink:#1A2142; --sale:#C3372B; --good:#1E7650; --wait:#8A5E00; --focus:#2F6FED;
  --mark:#F4C430;
  --scrim:rgba(14,19,38,.48); --shadow:0 20px 50px rgba(16,22,48,.24);
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#10131C; --card:#181D2A; --sunk:#232A3B; --ink:#E8ECF4; --ink-2:#A2ABBF; --line:#2C3448;
    --chalk:#F4C430; --chalk-ink:#1A2142; --sale:#FF7A6B; --good:#57C997; --wait:#E8B84B; --focus:#86A9FF;
    --mark:rgba(244,196,48,.36);
    --scrim:rgba(0,0,0,.6); --shadow:0 20px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#10131C; --card:#181D2A; --sunk:#232A3B; --ink:#E8ECF4; --ink-2:#A2ABBF; --line:#2C3448;
  --chalk:#F4C430; --chalk-ink:#1A2142; --sale:#FF7A6B; --good:#57C997; --wait:#E8B84B; --focus:#86A9FF;
  --mark:rgba(244,196,48,.36);
  --scrim:rgba(0,0,0,.6); --shadow:0 20px 50px rgba(0,0,0,.55);
}
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
}
body::before{
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10;
  background:var(--paper);
}
img{ max-width:100%; }
button{ font-family:inherit; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ transition:none !important; animation:none !important; }
}

/* header */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9;
  background:var(--paper);
}
.top-in{ max-width:1080px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:16px; min-height:60px; }
.mark{
  font-stretch:125%; font-weight:800; font-size:25px; letter-spacing:-.02em; line-height:1;
  text-decoration:none; color:var(--ink);
}
.tabs-wide{ display:none; gap:2px; margin-left:16px; }
.tabs-wide a{
  padding:8px 12px; font-weight:600; font-stretch:95%; color:var(--ink-2); text-decoration:none; border-radius:8px;
}
.tabs-wide a[aria-current="page"]{
  color:var(--ink); text-decoration:underline; text-decoration-color:var(--chalk);
  text-decoration-thickness:4px; text-underline-offset:7px;
}
.me-btn{
  margin-left:auto; width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
  color:var(--ink); border:1px solid var(--line); background:var(--card); text-decoration:none;
}
.me-btn[aria-current="page"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.me-btn svg, .tabbar svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

/* bottom tabs */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:9;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar a{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  min-height:58px; padding:6px 0; font-size:11.5px; font-weight:600; font-stretch:90%;
  color:var(--ink-2); text-decoration:none;
}
.tabbar a[aria-current="page"]{ color:var(--ink); }
.tabbar a[aria-current="page"]::before{
  content:""; position:absolute; top:-1px; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:var(--chalk);
}
@media (min-width:900px){
  .tabbar{ display:none; }
  body{ padding-bottom:0; }
  .tabs-wide{ display:flex; }
}

.wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }
main.wrap{ padding-bottom:40px; outline:none; }
.banner{
  margin:8px 0 0; padding:10px 14px; border-radius:10px; font-size:14px;
  background:var(--card); border:1px solid var(--sale); color:var(--ink);
}

/* type */
h1,h2,h3{ line-height:1.15; }
.page-head{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; padding:20px 0 12px; }
.page-head h1{ margin:0; font-size:clamp(34px,8.5vw,52px); font-stretch:125%; font-weight:800; letter-spacing:-.035em; line-height:1; }
.page-head p{ margin:0; }
.page-head .btn{ margin-left:auto; align-self:center; }
.block{ margin:30px 0; }
.block-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px; }
.block h2, .empty h2{ margin:0; font-size:21px; font-stretch:112%; font-weight:750; letter-spacing:-.01em; }
h3{ font-size:16px; font-weight:700; margin:20px 0 8px; }
.muted{ color:var(--ink-2); }
.small{ font-size:13.5px; }
.err{ color:var(--sale); font-weight:600; margin:8px 0 0; }
.err:empty{ display:none; }
.lead{ font-size:18px; max-width:62ch; margin:4px 0 12px; }
.thinking{ animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.45; } }

/* buttons, chips */
.btn{
  appearance:none; font:inherit; font-weight:650; font-size:15px; line-height:1.1;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:0 18px; border-radius:999px; cursor:pointer; text-decoration:none;
  border:1.5px solid var(--ink); background:transparent; color:var(--ink);
}
.btn.primary{ background:var(--ink); color:var(--paper); }
.btn.sm{ min-height:36px; padding:0 14px; font-size:14px; }
.btn.ghost{ border-color:transparent; color:var(--ink-2); }
.btn.danger{ color:var(--sale); }
.btn:disabled{ opacity:.45; cursor:default; }
.link{
  appearance:none; background:none; border:0; padding:0; font:inherit; font-weight:600; cursor:pointer;
  color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-align:left;
}
.row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
.row.tight{ margin-top:4px; }
.grow{ flex:1; }
.chips{ display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chips.wrap-chips{ flex-wrap:wrap; overflow:visible; padding-bottom:2px; }
.chip{
  flex:none; appearance:none; font:inherit; font-size:14px; font-weight:600; font-stretch:92%;
  min-height:36px; padding:0 14px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
}
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.pill{
  display:inline-block; font-size:12.5px; font-weight:600; font-stretch:90%;
  padding:2px 9px; border-radius:999px; background:transparent; color:var(--ink-2); border:1px solid var(--line);
}
.pills{ display:flex; flex-wrap:wrap; gap:6px; }
.hangtag{
  position:relative; display:inline-flex; align-items:center;
  padding:5px 12px 5px 22px; font-size:14px; font-weight:650; font-stretch:88%;
  color:var(--chalk-ink); background:var(--chalk);
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);
}
.hangtag::before{
  content:""; position:absolute; left:11px; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%;
  background:var(--card);
}
.hangtag.sm{ font-size:12.5px; padding:3px 10px 3px 19px; }
.hangtag.sm::before{ left:9px; width:4px; height:4px; margin-top:-2px; }

/* today */
.hero{ padding:14px 0 4px; }
.dateline{ margin:0; color:var(--ink-2); font-size:15px; }
.hero-q{ margin:10px 0 0; font-size:17px; font-weight:500; color:var(--ink-2); }
.occ-words{ display:flex; flex-direction:column; align-items:flex-start; margin:0 0 6px; }
.occ-word{
  appearance:none; border:0; background:none; cursor:pointer; color:var(--ink-2);
  font-family:var(--font); font-size:clamp(38px,10.5vw,76px); line-height:1; letter-spacing:-.035em;
  padding:0 .06em .04em 0; margin:0; border-radius:4px; text-align:left;
  font-weight:300; font-variation-settings:"wdth" 62, "wght" 300; opacity:.6;
  transition:font-variation-settings .5s cubic-bezier(.2,.75,.2,1), opacity .3s, color .3s;
}
.occ-word:hover{ opacity:.85; }
.occ-word[aria-checked="true"]{
  color:var(--ink); opacity:1; font-weight:800; font-variation-settings:"wdth" 125, "wght" 820;
  background:linear-gradient(transparent 60%, var(--mark) 60%, var(--mark) 88%, transparent 88%) no-repeat;
}
.pick{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:14px 0 0;
}
.pick.empty-pick{ background:transparent; border:1.5px dashed var(--line); }
.kicker{ margin:0; color:var(--ink-2); font-size:14px; }
.pick-name{ margin:2px 0 12px; font-size:22px; font-stretch:110%; font-weight:750; letter-spacing:-.01em; }
.pick-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px; }
.flatlay{ position:relative; display:grid; gap:6px; padding:6px; border-radius:10px; background:var(--paper); min-width:0; }
.flatlay.n1{ grid-template-columns:minmax(0,1fr); }
.flatlay.n2, .flatlay.n4{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
.flatlay.n3{ grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); }
.flatlay.n3 > :first-child{ grid-row:span 2; aspect-ratio:auto; }
.flatlay > img, .flatlay > .ph{ width:100%; height:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; }
.flatlay > img{ display:block; background:var(--card); }
.flatlay.n1 > img, .flatlay.n1 > .ph{ aspect-ratio:4/3; }
.more{
  position:absolute; right:12px; bottom:12px; padding:2px 8px; border-radius:999px;
  background:var(--ink); color:var(--paper); font-size:13px; font-weight:700;
}
.ph{
  display:grid; place-items:center; text-align:center; padding:8px; overflow:hidden;
  background:var(--sw, var(--sunk)); color:var(--ink); font-size:13px; font-weight:650; font-stretch:88%; line-height:1.2;
}
.ph.dk{ color:#F3F5FA; }
.combo-list{ display:grid; gap:12px; margin-top:14px; }
.combo{
  display:grid; grid-template-columns:minmax(96px,120px) 1fr; gap:14px; align-items:start;
  padding:12px; border:1px solid var(--line); border-radius:16px; background:var(--card);
}
.combo h3{ margin:0 0 4px; font-size:16px; }
.combo p{ margin:0; font-size:14.5px; color:var(--ink-2); }
.combo .flatlay{ padding:4px; gap:4px; }
.log{ list-style:none; padding:0; margin:0; }
.log li{
  display:grid; grid-template-columns:72px minmax(0,1fr) auto auto; gap:10px; align-items:center;
  padding:10px 0; border-top:1px solid var(--line);
}
.log-date{ font-weight:650; font-stretch:90%; color:var(--ink-2); font-size:14px; }
.log-name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.field{ display:flex; flex-direction:column; gap:6px; margin:12px 0; border:0; padding:0; min-width:0; }
.field > span:first-child, .field > legend{ font-size:14px; font-weight:600; color:var(--ink-2); padding:0; margin-bottom:6px; }
.field > span:first-child{ margin-bottom:0; }
input[type="text"], input[type="number"], input[type="url"], input[type="date"], select, textarea{
  font:inherit; font-size:16px; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:10px; min-height:46px; padding:10px 12px; width:100%;
}
textarea{ min-height:84px; resize:vertical; }
select{ appearance:auto; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
@media (min-width:900px){
  .today{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:0 56px; align-items:start; }
  .today .hero{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 76px); padding-top:28px; }
  .today-main{ padding-top:22px; }
}

/* closet */
.filters{ display:flex; flex-direction:column; gap:2px; }
.sort{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:var(--ink-2); max-width:320px; }
.sort select{ min-height:38px; padding:6px 10px; font-size:15px; width:auto; }
.grid{ list-style:none; margin:14px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:20px 12px; }
.tile{ all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; width:100%; }
.tile:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:6px; }
.tile-ph{ display:block; aspect-ratio:1; border-radius:6px; overflow:hidden; background:var(--sunk); border:1px solid var(--line); }
.tile-ph > img, .tile-ph > .ph{ width:100%; height:100%; object-fit:cover; }
.tile-ph > img{ display:block; }
.ph-ico{ width:34%; height:34%; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; opacity:.45; }
.tile-name{ font-weight:650; font-size:15px; line-height:1.25; }
.tile-sub{ font-size:13px; color:var(--ink-2); }

/* outfits */
.outfit-grid{ list-style:none; padding:0; margin:12px 0 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
.ocard{ display:flex; flex-direction:column; gap:10px; padding:10px; min-width:0; border:1px solid var(--line); border-radius:16px; background:var(--card); }
.ocard-main{ all:unset; cursor:pointer; display:grid; gap:10px; min-width:0; }
.ocard-main:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:10px; }
.ocard-name{ font-weight:700; font-size:16px; line-height:1.25; }
.ocard-meta{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

/* shop */
.seg{
  display:flex; gap:4px; padding:4px; width:fit-content; max-width:100%; overflow-x:auto;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
}
.seg button{
  appearance:none; border:0; background:transparent; font:inherit; font-weight:650; font-size:14.5px;
  padding:8px 14px; border-radius:999px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.seg button[aria-selected="true"]{ background:var(--ink); color:var(--paper); }
.panel-head{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin:18px 0 4px; }
.panel-head p{ margin:0; max-width:58ch; }
.cards{ list-style:none; padding:0; margin:14px 0; display:grid; gap:14px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
.card h3{ margin:0 0 2px; font-size:17px; }
.wish-top{ display:flex; gap:12px; }
.wish-img{ width:76px; height:76px; object-fit:cover; border-radius:6px; flex:none; }
.price{ font-weight:750; font-stretch:110%; margin:4px 0; }
.overlap{ margin:12px 0 0; font-size:14px; padding:8px 10px; background:var(--paper); border-radius:8px; }
.verdict{ margin-top:10px; padding:10px 12px; background:var(--paper); border-left:4px solid var(--wait); border-radius:0 8px 8px 0; }
.verdict.good{ border-color:var(--good); }
.verdict.bad{ border-color:var(--sale); }
.verdict p{ margin:0; }
.verdict ul{ margin:6px 0 0; padding-left:18px; }
.verdict .v-word{ font-weight:800; font-stretch:112%; }
.verdict.good .v-word{ color:var(--good); } .verdict.bad .v-word{ color:var(--sale); } .verdict.wait .v-word{ color:var(--wait); }
.hunt-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.hunt-head p{ margin:2px 0 0; }
.status{ flex:none; font-size:13px; font-weight:650; padding:4px 10px; border-radius:999px; background:var(--paper); white-space:nowrap; }
.status.wait{ color:var(--wait); } .status.good{ color:var(--good); }
.hunt-how, .hunt-sum{ margin:10px 0 0; font-size:14.5px; }
.hunt-how{ color:var(--ink-2); }
.results{ list-style:none; margin:10px 0 0; padding:0; counter-reset:r; }
.result{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:12px 0; border-top:1px solid var(--line); counter-increment:r; }
.result p{ margin:4px 0 0; font-size:14.5px; }
.r-title{ font-weight:700; color:var(--ink); }
.r-title::before{ content:counter(r) ". "; color:var(--ink-2); }
.r-side{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; text-align:right; }
.r-side s{ font-size:13.5px; }
.off{ font-size:12.5px; font-weight:750; padding:2px 8px; border-radius:999px; background:var(--sale); color:var(--card); }

/* spend */
.spend-num{ margin:4px 0 2px; font-size:clamp(56px,17vw,104px); font-weight:800; font-stretch:125%; letter-spacing:-.045em; line-height:1; }
.meter{ height:10px; background:var(--sunk); border-radius:999px; overflow:hidden; margin:12px 0 6px; max-width:440px; }
.meter > span{ display:block; height:100%; width:0; background:var(--chalk); border-radius:inherit; }
.meter.over > span{ background:var(--sale); }
.chart{ display:block; width:100%; max-width:600px; height:auto; }
.chart .bar{ fill:var(--ink); }
.chart .bar.now{ fill:var(--chalk); stroke:var(--chalk-ink); stroke-width:1; }
.chart .axis{ fill:var(--ink-2); font-size:11px; font-family:var(--font); font-weight:600; }
.chart .base{ stroke:var(--line); stroke-width:1; }
.bars{ list-style:none; padding:0; margin:0; display:grid; gap:12px; max-width:600px; }
.bars li{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; }
.bars .meter{ grid-column:1 / -1; margin:2px 0 0; height:8px; max-width:none; }
.bars .meter > span{ background:var(--ink); }
.cpw{ list-style:none; padding:0; margin:10px 0 0; display:grid; gap:10px; max-width:600px; }
.cpw li{ display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:12px; align-items:center; }
.cpw .tile-ph{ width:48px; height:48px; }
.cpw-n{ font-weight:700; white-space:nowrap; text-align:right; }

/* profile */
.me-photos{ list-style:none; padding:0; margin:14px 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; max-width:720px; }
.me-photos li{ position:relative; aspect-ratio:3/4; }
.me-photos img, .me-photos .ph{ width:100%; height:100%; object-fit:cover; border-radius:6px; display:block; }
.me-photos .x{
  position:absolute; top:5px; right:5px; min-width:32px; height:32px; padding:0 8px; border:0; border-radius:999px;
  background:rgba(10,14,30,.66); color:#fff; font-size:17px; font-weight:600; cursor:pointer;
}
.me-photos .x.confirm{ font-size:13px; background:var(--sale); }
.add-photo{
  width:100%; height:100%; border:1.5px dashed var(--line); border-radius:6px; background:transparent;
  color:var(--ink); font:inherit; font-weight:650; cursor:pointer;
}
.swatches{ list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:14px 10px; max-width:760px; }
.swatch{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:650; line-height:1.25; }
.sw-wrap{ display:block; filter:drop-shadow(0 0 .6px rgba(20,28,60,.55)); }
.chip-sw{
  display:block; height:68px; background:var(--sw, var(--sunk)); border-radius:4px 4px 0 0;
  clip-path:polygon(0 0,100% 0,100% 84%,95% 100%,90% 84%,85% 100%,80% 84%,75% 100%,70% 84%,65% 100%,60% 84%,55% 100%,50% 84%,45% 100%,40% 84%,35% 100%,30% 84%,25% 100%,20% 84%,15% 100%,10% 84%,5% 100%,0 84%);
}
.sw-why{ font-weight:400; font-size:12.5px; color:var(--ink-2); }

  width:120px; height:120px; border-radius:8px; overflow:hidden; display:grid; place-items:center; text-align:center;

/* toast */

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const OCC = [
  { id: "office", label: "Office" },
  { id: "college", label: "College" },
  { id: "party", label: "Party" },
  { id: "home", label: "Home" },
];
const OCC_LABEL = Object.fromEntries(OCC.map(o => [o.id, o.label]));
const CATS = ["Tops", "Bottoms", "Layers", "Shoes", "Accessories", "Sets & suits"];
const CAT_ORDER = ["Tops", "Sets & suits", "Layers", "Bottoms", "Shoes", "Accessories"];
const VIEWS = ["today", "closet", "outfits", "shop", "spend", "profile"];
const FATAL = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);
const SORTS = [["recent", "Recently added"], ["stale", "Longest since worn"], ["least", "Least worn"], ["most", "Most worn"], ["price", "Price, high to low"]];
const NAMED = {
  black: "#1c1c1e", white: "#f6f6f3", ivory: "#f1ead8", cream: "#ede3c8", beige: "#d6c3a1", khaki: "#b5a273",
  tan: "#c19f72", camel: "#c0955f", brown: "#6a4a33", navy: "#1f2a48", "light blue": "#a9c4e4", "sky blue": "#86b4df",
  blue: "#3a5aa4", teal: "#2c7a7a", "forest green": "#2c4a33", olive: "#6a6a39", green: "#3e7a4a", charcoal: "#3c3f47",
  grey: "#8a8f98", gray: "#8a8f98", silver: "#c0c4ca", maroon: "#6c1f2a", burgundy: "#6d1f30", red: "#b2261e",
  pink: "#e6a2b6", lavender: "#b7a8d8", purple: "#6a4b99", mustard: "#c79a2d", yellow: "#e6c446", orange: "#d8722a", rust: "#a54a2a",
};
const ERR = {
  not_granted: "Claude isn’t allowed in this app yet. Allow it when asked, or turn it on in the app’s permissions.",
  sampling_disabled: "Claude isn’t available on this account.",
  rate_limited: "Claude is busy or you’ve reached a usage limit. Try again in a little while.",
  session_expired: "You’ve been signed out. Sign in to Claude and try again.",
  image_rejected: "That photo couldn’t be sent. Try a JPEG or PNG.",
  images_unavailable: "Sending photos to Claude isn’t available here.",
  refused: "Claude couldn’t help with that one. Try different details or photos.",
  invalid_json: "Claude’s answer came back in the wrong format. Try again.",
  empty_completion: "Claude didn’t send anything back. Try again.",
  prompt_too_large: "That’s too much to send at once. Try again with fewer photos or items.",
  quota_exceeded: "This app’s storage is full. Delete some old items or photos, then try again.",
  resource_exhausted: "Too many changes at once. Wait a moment and try again.",
  invalid_argument: "That couldn’t be saved. Check the details and try again.",
  revoked: "Saving is turned off for this view right now.",
  too_large: "That photo is too large. Try a smaller one.",
  unsupported_type: "That file type isn’t supported. Use a JPEG or PNG.",
  quota_or_state: "Photo storage is full. Delete some old photos, then try again.",
  _nophoto: "Photos can’t be saved in this view.",
};

/* ---------- state ---------- */
const S = {
  phase: "loading", note: "", uid: null,
  profile: {}, profileExists: false,
  items: new Map(), outfits: new Map(), wish: new Map(), hunts: new Map(), wearlog: new Map(),
  loaded: { profile: false, items: false, outfits: false, wish: false, hunts: false, wearlog: false },
  view: "today", occ: "office", pickIndex: 0, showPicks: false, todayNotes: "",
  ideas: null,
  closet: { cat: "all", occ: "any", sort: "recent", retired: false },
  outfitOcc: "any", shopTab: "wishlist",
  gaps: { occ: "office", loading: false, ideas: null, forOcc: null, error: "" },
  checks: {},
  analysis: { loading: false, error: "" },
};
const cap = { db: null, user: null, assets: null, sample: null, imagesOK: false, imageMax: 0, sampleOff: false, sampleKnown: false };
let closetRef = null;
let wearCache = null;
let loadTimer = null;
let ideasCtl = null;

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const arr = v => (Array.isArray(v) ? v : []);
const str = (v, n = 200) => (typeof v === "string" ? v : v == null ? "" : String(v)).trim().slice(0, n);
const num = v => {
  if (v === "" || v == null) return null;
  const n = Number(v);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cap1 = s => { const t = str(s, 40); return t ? t[0].toUpperCase() + t.slice(1) : ""; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));

function ymd(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const validDate = s => (typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : "");
function dayNum(s) { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
function daysAgo(s) { return validDate(s) ? dayNum(ymd()) - dayNum(s) : null; }
function shortDate(s) {
  if (!validDate(s)) return "";
  const [y, m, d] = s.split("-").map(Number);
  const opts = { month: "short", day: "numeric" };
  if (y !== new Date().getFullYear()) opts.year = "numeric";
  return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
}
function lastWornText(s) {
  const n = daysAgo(s);
  if (n === null) return "Never worn";
  if (n <= 0) return "Worn today";
  if (n === 1) return "Worn yesterday";
  return `Last worn ${n} days ago`;
}
function money(v) {
  const n = Number(v) || 0;
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
}
function safeHex(h) { return typeof h === "string" && /^#[0-9a-f]{6}$/i.test(h.trim()) ? h.trim().toLowerCase() : ""; }
function safeUrl(u) {
  try { const x = new URL(String(u)); return x.protocol === "https:" || x.protocol === "http:" ? x.href : ""; } catch (_) { return ""; }
}
const NAMED_KEYS = Object.keys(NAMED).sort((a, b) => b.length - a.length);
function colorKey(s) {
  const c = String(s || "").toLowerCase();
  const k = NAMED_KEYS.find(n => c.includes(n));
  return k ? (k === "gray" ? "grey" : k) : c.trim();
}
function swatchFor(it) {
  const h = safeHex(it.colorHex);
  if (h) return h;
  const k = colorKey(it.color);
  return NAMED[k] || "";
}
function isDark(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b < 140;
}
function applyDecor(root) {
  root.querySelectorAll("[data-sw]").forEach(el => {
    const v = safeHex(el.dataset.sw);
    if (v) { el.style.setProperty("--sw", v); el.classList.toggle("dk", isDark(v)); }
  });
  root.querySelectorAll("[data-pct]").forEach(el => {
    const p = Math.max(0, Math.min(100, Number(el.dataset.pct) || 0));
    el.style.width = p + "%";
  });
}
const photoUrl = id => (id ? "/_blob/" + encodeURIComponent(id) : "");
const sampleOn = () => !!cap.sample && !cap.sampleOff;
function errText(e) { return (e && ERR[e.code]) || "Something went wrong. Try again."; }
function noteSampleFailure(e) {
  if (!e) return;
  if (FATAL.has(e.code) && !cap.sampleOff) {
    cap.sampleOff = true;
    toast(e.code === "not_granted" ? "Claude is switched off for this app. You can turn it back on from your style profile." : errText(e));
  }
  if (e.code === "images_unavailable") cap.imagesOK = false;
  render();
}
async function openPermissions() {
  const C = window.claude;
  const perm = C && typeof C.use === "function" ? await C.use("permissions").catch(() => null) : null;
  if (!perm) { toast("Open this app’s Permissions menu to turn Claude back on."); return; }
  try {
    await perm.manage();
    const st = await perm.state("sample");
    if (st === "granted" || st === "prompt") { cap.sampleOff = false; render(); }
  } catch (_) { toast("Open this app’s Permissions menu to turn Claude back on."); }
}

/* ---------- data accessors ---------- */
const itemsAll = () => [...S.items].map(([id, d]) => ({ ...d, id }));
const activeItems = () => itemsAll().filter(i => i.status !== "retired");
const itemById = id => { const d = S.items.get(id); return d ? { ...d, id } : null; };
const outfitsAll = () => [...S.outfits].map(([id, d]) => ({ ...d, id }));
const outfitItems = o => arr(o.itemIds).map(itemById).filter(Boolean);
const catRank = i => { const k = CAT_ORDER.indexOf(i.category); return k < 0 ? 9 : k; };
function outfitName(o) {
  return str(o.name, 80) || outfitItems(o).slice(0, 2).map(i => i.name).join(" + ") || "Untitled outfit";
}
function wear() {
  if (wearCache) return wearCache;
  const items = new Map(), outfits = new Map(), entries = [];
  for (const [month, d] of S.wearlog) for (const e of arr(d && d.entries)) if (e && validDate(e.date)) entries.push({ ...e, month });
  entries.sort((a, b) => b.date.localeCompare(a.date) || (b.t || 0) - (a.t || 0));
  const bump = (m, id, date) => {
    const s = m.get(id) || { count: 0, last: null };
    s.count++;
    if (!s.last || date > s.last) s.last = date;
    m.set(id, s);
  };
  for (const e of entries) {
    arr(e.itemIds).forEach(id => bump(items, id, e.date));
    if (e.outfitId) bump(outfits, e.outfitId, e.date);
  }
  wearCache = { items, outfits, entries };
  return wearCache;
}
function outfitsFor(occ) {
  const w = wear().outfits;
  return outfitsAll()
    .filter(o => arr(o.occasions).includes(occ))
    .filter(o => { const its = outfitItems(o); return its.length && its.every(i => i.status !== "retired"); })
    .sort((a, b) => ((w.get(a.id) || {}).last || "0000").localeCompare((w.get(b.id) || {}).last || "0000") || (a.createdAt || 0) - (b.createdAt || 0));
}
function monthSpend() {
  const m = ymd().slice(0, 7);
  return itemsAll().filter(i => validDate(i.boughtOn) && i.boughtOn.slice(0, 7) === m).reduce((s, i) => s + (num(i.price) || 0), 0);
}
function assetInUse(assetId, opts = {}) {
  for (const [id, d] of S.items) if (id !== opts.exceptItem && d.photo === assetId) return true;
  for (const [id, d] of S.wish) if (id !== opts.exceptWish && d.photo === assetId) return true;
  if (!opts.skipProfile && arr(S.profile.photos).includes(assetId)) return true;
  return false;
}
const GENERIC = new Set(["the", "and", "with", "for", "men", "mens", "slim", "regular", "relaxed", "fit", "classic", "new", "cotton", "stretch", "casual", "formal", "long", "short", "sleeve", "size", "light", "dark"]);
const COLOR_WORDS = new Set(Object.keys(NAMED).flatMap(k => k.split(" ")));
const words = s => String(s || "").toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2 && !GENERIC.has(w) && !COLOR_WORDS.has(w));
function similarTo(x) {
  const ws = new Set(words(`${x.name} ${x.type || ""}`));
  const ck = colorKey(x.color || "");
  return activeItems()
    .filter(i => (!x.category || !i.category || i.category === x.category) && words(`${i.type} ${i.name}`).some(w => ws.has(w)))
    .sort((a, b) => (colorKey(b.color) === ck) - (colorKey(a.color) === ck));
}

/* ---------- db ---------- */
const queues = new Map();
function enqueue(key, fn) {
  const prev = queues.get(key) || Promise.resolve();
  const run = prev.then(fn);
  const tail = run.then(() => {}, () => {});
  queues.set(key, tail);
  tail.then(() => { if (queues.get(key) === tail) queues.delete(key); });
  return run;
}
const col = name => closetRef.collection(name);
const newId = name => col(name).doc().id;
function setDoc(name, id, data) { const ref = col(name).doc(id); return enqueue(ref.path, () => ref.set(data)); }
function patchDoc(name, id, data) { const ref = col(name).doc(id); return enqueue(ref.path, () => ref.update(data)); }
function delDoc(name, id) { const ref = col(name).doc(id); return enqueue(ref.path, () => ref.delete()); }
function saveProfile(partial) {
  return enqueue(closetRef.path, async () => {
    if (S.profileExists) await closetRef.update(partial);
    else { await closetRef.set({ ...S.profile, ...partial }); S.profileExists = true; }
  });
}
function allLoaded() { return Object.values(S.loaded).every(Boolean); }
function loadedOne(name, meta) {
  S.loaded[name] = true;
  if (allLoaded()) S.phase = "ready";
  if (meta && !meta.fromCache && allLoaded()) {
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    if (S.note.startsWith("Your saved closet")) S.note = "";
  }
  render();
}
function subscribe() {
  loadTimer = setTimeout(() => {
    loadTimer = null;
    if (!allLoaded()) { S.note = "Your saved closet can’t be reached right now, so what you see may be out of date."; S.phase = "ready"; render(); }
  }, 10000);
  const onErr = e => {
    S.note = e && e.code === "revoked" ? "Saving is turned off for this view." : "Your closet stopped syncing. Reload the page to reconnect.";
    render();
  };
  closetRef.onSnapshot(snap => {
    S.profileExists = !!snap.exists;
    S.profile = snap.exists ? clone(snap.data()) : {};
    loadedOne("profile", snap.metadata);
  }, onErr);
  ["items", "outfits", "wish", "hunts", "wearlog"].forEach(name => {
    col(name).onSnapshot(qs => {
      const m = new Map();
      qs.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
      S[name] = m;
      if (name === "wearlog") wearCache = null;
      loadedOne(name, qs.metadata);
    }, onErr);
  });
}

/* ---------- wear log ---------- */
async function logWear({ outfitId = null, itemIds = [], occasion, date = ymd() }) {
  const month = date.slice(0, 7);
  const ref = col("wearlog").doc(month);
  const entry = { id: rid(), date, t: Date.now(), outfitId, itemIds: [...itemIds], occasion: occasion || S.occ };
  await enqueue(ref.path, async () => {
    const prev = S.wearlog.get(month);
    const entries = [...arr(prev && prev.entries), entry];
    S.wearlog.set(month, { month, entries }); wearCache = null; render();
    try { await ref.set({ month, entries }); }
    catch (e) { if (prev) S.wearlog.set(month, prev); else S.wearlog.delete(month); wearCache = null; render(); throw e; }
  });
  return { month, id: entry.id };
}
async function removeWear(month, id) {
  const ref = col("wearlog").doc(month);
  await enqueue(ref.path, async () => {
    const prev = S.wearlog.get(month);
    const entries = arr(prev && prev.entries).filter(e => e.id !== id);
    S.wearlog.set(month, { month, entries }); wearCache = null; render();
    try { if (entries.length) await ref.set({ month, entries }); else await ref.delete(); }
    catch (e) { if (prev) S.wearlog.set(month, prev); wearCache = null; render(); throw e; }
  });
}
async function wearOutfit(id, occ, opts = {}) {
  const o = S.outfits.get(id);
  const itemIds = opts.itemIds || arr(o && o.itemIds);
  const date = opts.date || ymd();
  const occs = arr(o && o.occasions);
  const occasion = occ || (occs.includes(S.occ) ? S.occ : occs[0] || S.occ);
  const isToday = date === ymd();
  if (wear().entries.some(e => e.date === date && e.outfitId === id)) {

}

/* ---------- photos ---------- */
function readAsDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function decodeImage(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (_) {}
  }
  return loadImage(await readAsDataURL(file));
}
async function shrink(file, max = 1280, q = 0.85) {
  const src = await decodeImage(file);
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  if (!w0 || !h0) throw new Error("decode");
  const s = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(src, 0, 0, w, h);
  if (src.close) src.close();
  const blob = await new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", q));
  return { blob, dataUrl: c.toDataURL("image/jpeg", 0.7) };
}
const blobCache = new Map();
async function uploadPhoto(blob) {
  const up = await cap.assets.upload(blob, { type: "image/jpeg" });
  blobCache.set(up.id, blob);
  return up.id;
}
async function blobFromAsset(id) {
  if (blobCache.has(id)) return blobCache.get(id);
  try {
    const r = await fetch(photoUrl(id));
    if (r.ok) { const b = await r.blob(); if (b.size && /^image\//.test(b.type)) return b; }
  } catch (_) {}
  const im = await loadImage(photoUrl(id));
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  c.getContext("2d").drawImage(im, 0, 0);
  return new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", 0.88));
}
function pickFiles(multiple) {
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    if (multiple) inp.multiple = true;
    inp.style.position = "fixed"; inp.style.left = "-9999px"; inp.style.opacity = "0";
    const host = sheet.open ? $("#sheet-body") : document.body;
    let settled = false;
    const finish = files => { if (settled) return; settled = true; inp.remove(); resolve(files); };
    inp.addEventListener("change", () => finish(Array.from(inp.files || [])));
    inp.addEventListener("cancel", () => finish([]));
    host.appendChild(inp);
    inp.click();
  });
}

/* ---------- rendering ---------- */
let raf = 0;
function render() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; draw(); });
}
function draw() {
  document.querySelectorAll("[data-tab]").forEach(a => {
    if (a.dataset.tab === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const b = $("#banner");
  b.hidden = !S.note; b.textContent = S.note;
  const v = $("#view");
  const ae = document.activeElement;
  const fid = ae && ae.id && v.contains(ae) ? ae.id : null;
  let sel = null;
  if (fid) { try { if (typeof ae.selectionStart === "number") sel = [ae.selectionStart, ae.selectionEnd]; } catch (_) {} }
  v.innerHTML = S.phase === "ready" ? (VIEW[S.view] || VIEW.today)() : phaseScreen();
  applyDecor(v);
  if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus({ preventScroll: true });
      if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (_) {} }
    }
  }
}
function phaseScreen() {
  if (S.phase === "loading") return `<section class="empty soft"><h2>Opening your closet…</h2></section>`;

function chip(group, val, label, on) {

const HANGER = `<svg class="ph-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6.2a2 2 0 1 1 3 1.7c-.6.4-1 .9-1 1.6v.7"/><path d="M12 10.2 3.6 16a1 1 0 0 0 .6 1.8h15.6a1 1 0 0 0 .6-1.8z"/></svg>`;
function cell(i, bare) {

/* closet */
function viewCloset() {
  const all = itemsAll();
  const f = S.closet;
  const w = wear().items;
  let list = all.filter(i => (f.retired ? i.status === "retired" : i.status !== "retired"));
  if (f.cat !== "all") list = list.filter(i => i.category === f.cat);
  if (f.occ !== "any") list = list.filter(i => arr(i.occasions).includes(f.occ));
  const cnt = id => (w.get(id) || {}).count || 0;
  const last = id => (w.get(id) || {}).last || "0000";
  const sorters = {
    recent: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
    stale: (a, b) => last(a.id).localeCompare(last(b.id)),
    least: (a, b) => cnt(a.id) - cnt(b.id),
    most: (a, b) => cnt(b.id) - cnt(a.id),
    price: (a, b) => (num(b.price) || 0) - (num(a.price) || 0),
  };
  list.sort(sorters[f.sort] || sorters.recent);
  const active = all.filter(i => i.status !== "retired").length;
  const retired = all.length - active;
  let h = `<div class="page-head"><h1>${f.retired ? "Retired" : "Closet"}</h1><p class="muted">${plural(f.retired ? retired : active, "piece", "pieces")}</p><button type="button" class="btn primary" data-act="add-item">Add clothes</button></div>`;
  if (!all.length) {
    return h + emptyBlock("Nothing here yet", "Snap a photo of each piece you own. Claude can fill in the name, color and where it fits, so each one takes a few seconds.", `<button type="button" class="btn primary" data-act="add-item">Add your first piece</button>`);
  }
  h += `<div class="filters">
    <div class="chips" role="group" aria-label="Category">${chip("cat", "all", "All", f.cat === "all")}${CATS.map(c => chip("cat", c, c, f.cat === c)).join("")}</div>
    <div class="chips" role="group" aria-label="Occasion">${chip("cocc", "any", "Any occasion", f.occ === "any")}${OCC.map(o => chip("cocc", o.id, o.label, f.occ === o.id)).join("")}</div>
    <label class="sort"><span>Sort</span><select id="closet-sort">${SORTS.map(([v, l]) => `<option value="${v}"${f.sort === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
  </div>`;
  if (!list.length) h += `<p class="muted">Nothing matches these filters.</p>`;
  else h += `<ul class="grid">${list.map(i => tile(i, w.get(i.id))).join("")}</ul>`;
  if (retired || f.retired) h += `<div class="row"><button type="button" class="link" id="toggle-retired" data-act="toggle-retired">${f.retired ? "Back to your closet" : `Show retired pieces (${retired})`}</button></div>`;
  return h;
}

/* spend */
function viewSpend() {
  const items = itemsAll();
  const priced = items.filter(i => num(i.price) > 0);
  let h = `<div class="page-head"><h1>Spend</h1></div>`;
  if (!priced.length) {
    return h + emptyBlock("No prices yet", "Add what you paid when you add clothes. This page then shows what you spend each month and which pieces earn their keep.", `<button type="button" class="btn primary" data-act="add-item">Add clothes</button>`);
  }
  const dated = priced.filter(i => validDate(i.boughtOn));
  const now = new Date(), thisMonth = ymd(now).slice(0, 7);
  const months = [];
  for (let k = 11; k >= 0; k--) months.push(ymd(new Date(now.getFullYear(), now.getMonth() - k, 1)).slice(0, 7));
  const byMonth = Object.fromEntries(months.map(m => [m, 0]));
  dated.forEach(i => { const m = i.boughtOn.slice(0, 7); if (m in byMonth) byMonth[m] += num(i.price); });
  const monthTotal = byMonth[thisMonth] || 0;
  const yearTotal = months.reduce((s, m) => s + byMonth[m], 0);
  const budget = num(S.profile.budget) || 0;
  const monthName = now.toLocaleDateString(undefined, { month: "long" });
  const over = budget && monthTotal > budget;
  h += `<section class="block" style="margin-top:8px">
    <p class="spend-num">${money(Math.round(monthTotal))}</p>
    <p class="muted" style="margin:0">spent in ${esc(monthName)}${budget ? ` of your ${money(budget)} budget` : ""}</p>
    ${budget ? `<div class="meter${over ? " over" : ""}"><span data-pct="${Math.round(Math.min(100, (monthTotal / budget) * 100))}"></span></div>
      <p class="small ${over ? "err" : "muted"}" style="margin:0">${over ? `${money(Math.round(monthTotal - budget))} over budget` : `${money(Math.round(budget - monthTotal))} left this month`}</p>`
      : `<div class="row"><button type="button" class="link" data-act="edit-prefs">Set a monthly budget</button></div>`}
  </section>`;
  h += `<section class="block"><div class="block-head"><h2>Last 12 months</h2><span class="muted">${money(Math.round(yearTotal))} total</span></div>${monthChart(months, byMonth, thisMonth)}</section>`;
  const cat = {};
  dated.forEach(i => { if (i.boughtOn.slice(0, 7) >= months[0]) { const c = i.category || "Other"; cat[c] = (cat[c] || 0) + num(i.price); } });
  const rows = Object.entries(cat).sort((a, b) => b[1] - a[1]);
  const top = Math.max(1, ...rows.map(r => r[1]));
  if (rows.length) {
    h += `<section class="block"><div class="block-head"><h2>By category</h2></div><ul class="bars">${rows.map(([c, v]) => `<li><span>${esc(c)}</span><span class="muted">${money(Math.round(v))}</span><div class="meter"><span data-pct="${Math.round((v / top) * 100)}"></span></div></li>`).join("")}</ul></section>`;
  }
  const w = wear().items;
  const cpw = priced.map(i => { const c = (w.get(i.id) || {}).count || 0; return { i, c, v: num(i.price) / Math.max(1, c) }; });
  const best = cpw.filter(r => r.c >= 2).sort((a, b) => a.v - b.v).slice(0, 5);
  const idle = cpw.filter(r => r.i.status !== "retired" && r.c <= 1 && (!validDate(r.i.boughtOn) || daysAgo(r.i.boughtOn) >= 30)).sort((a, b) => num(b.i.price) - num(a.i.price)).slice(0, 5);
  if (best.length) h += cpwBlock("Earning their keep", "Lowest cost per wear so far.", best);
  if (idle.length) h += cpwBlock("Waiting for a wear", "Worn once or never, and bought more than a month ago.", idle);
  const missing = items.filter(i => i.status !== "retired" && !(num(i.price) > 0 && validDate(i.boughtOn))).length;
  if (missing) h += `<p class="muted small">${plural(missing, "piece has", "pieces have")} no price or purchase date, so ${missing === 1 ? "it isn’t" : "they aren’t"} in the monthly totals.</p>`;
  return h;
}
function monthChart(months, byMonth, thisMonth) {
  const W = 360, base = 118, top = 12, bw = 18, gap = (W - 12 * bw) / 12;
  const max = Math.max(1, ...months.map(m => byMonth[m]));
  const bars = months.map((m, k) => {
    const v = byMonth[m];
    const hgt = v ? Math.max(3, Math.round((v / max) * (base - top))) : 2;
    const x = gap / 2 + k * (bw + gap);
    const [yy, mm] = m.split("-").map(Number);
    const d = new Date(yy, mm - 1, 1);
    const label = d.toLocaleDateString(undefined, { month: "narrow" });
    const long = d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    return `<g><title>${esc(long)}: ${money(Math.round(v))}</title><rect class="bar${m === thisMonth ? " now" : ""}" x="${x.toFixed(1)}" y="${base - hgt}" width="${bw}" height="${hgt}" rx="2"></rect><text class="axis" x="${(x + bw / 2).toFixed(1)}" y="${base + 18}" text-anchor="middle">${esc(label)}</text></g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${base + 26}" role="img" aria-label="Clothing spend per month for the last 12 months">${bars}<line class="base" x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}"></line></svg>`;
}
function cpwBlock(title, sub, rows) {
  return `<section class="block"><div class="block-head"><h2>${esc(title)}</h2></div><p class="muted small" style="margin:0">${esc(sub)}</p>
    <ul class="cpw">${rows.map(r => `<li><span class="tile-ph">${cell(r.i, true)}</span><button type="button" class="link" data-act="open-item" data-id="${esc(r.i.id)}">${esc(r.i.name)}</button><span class="cpw-n">${money(Math.round(r.v * 100) / 100)}<span class="muted small"> per wear</span></span></li>`).join("")}</ul>
  </section>`;
}

        if (!r || typeof r !== "object") throw { code: "invalid_json" };
        if (str(r.name, 80)) q("#ip-name").value = str(r.name, 80);
        if (CATS.includes(r.category)) q("#ip-cat").value = r.category;
        if (str(r.type, 60)) q("#ip-type").value = str(r.type, 60);
        if (str(r.color, 40)) q("#ip-color").value = str(r.color, 40);
        if (str(r.pattern, 40)) q("#ip-pattern").value = str(r.pattern, 40);
        const h2 = safeHex(r.colorHex);
        if (h2) { hex = h2; q("#ip-dot").dataset.sw = h2; applyDecor(root); }
        const oc = arr(r.occasions).map(x => String(x).toLowerCase()).filter(x => OCC_LABEL[x]);
        if (oc.length) {
          occs.clear(); oc.forEach(x => occs.add(x));
          root.querySelectorAll("[data-occt]").forEach(b => b.setAttribute("aria-pressed", String(occs.has(b.dataset.occt))));
        }
        if (str(r.notes, 200) && !q("#ip-notes").value.trim()) q("#ip-notes").value = str(r.notes, 200);
        hint.textContent = "Filled in. Check the details and fix anything that’s off.";
      } catch (e) {
        hint.textContent = e && e.code === "cancelled" ? "" : e && e.code ? errText(e) : "The photo couldn’t be read. Try choosing it again.";
        noteSampleFailure(e);
      } finally {
        fillBtn.disabled = false;
        fillCtl = null;
      }
    };
    q("#ip-color").addEventListener("input", () => {
      hex = "";
      const dot = q("#ip-dot");
      const k = NAMED[colorKey(q("#ip-color").value)];
      if (k) { dot.dataset.sw = k; applyDecor(root); } else { delete dot.dataset.sw; dot.style.removeProperty("--sw"); }
    });
    q("#ip-save").onclick = async () => {
      const err = q("#ip-err");
      err.textContent = "";
      const name = q("#ip-name").value.trim();
      if (!name) { err.textContent = "Give it a name, like “Navy oxford shirt”."; q("#ip-name").focus(); return; }
      const btn = q("#ip-save");
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        let photo = base.photo || null, oldPhoto = null;
        if (pending) {
          if (!cap.assets) throw { code: "_nophoto" };
          const upId = await uploadPhoto(pending.blob);
          if (it && it.photo) oldPhoto = it.photo;
          photo = upId;
        }
        const docId = it ? it.id : newId("items");
        const data = {
          name: name.slice(0, 80),
          category: q("#ip-cat").value,
          type: q("#ip-type").value.trim().slice(0, 60),
          color: q("#ip-color").value.trim().slice(0, 40),
          colorHex: hex || "",
          pattern: q("#ip-pattern").value.trim().slice(0, 40),
          occasions: OCC.map(o => o.id).filter(x => occs.has(x)),
          price: num(q("#ip-price").value),
          boughtOn: validDate(q("#ip-date").value),
          brand: q("#ip-brand").value.trim().slice(0, 60),
          size: q("#ip-size").value.trim().slice(0, 20),
          store: q("#ip-store").value.trim().slice(0, 60),
          notes: q("#ip-notes").value.trim().slice(0, 500),
          photo,
          status: it ? it.status || "active" : "active",
          createdAt: it ? it.createdAt || Date.now() : Date.now(),
          updatedAt: Date.now(),
        };
        await setDoc("items", docId, data);
        if (oldPhoto && cap.assets && !assetInUse(oldPhoto, { exceptItem: docId })) cap.assets.delete(oldPhoto).catch(() => {});
        closeSheet();
        toast(it ? "Saved" : "Added to your closet");
        if (onSaved) onSaved(docId);
      } catch (e) {
        err.textContent = errText(e);
        btn.disabled = false; btn.textContent = label;
      }
    };
    const del = q("#ip-del");
    if (del) del.onclick = async () => {
      if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "Tap again to delete"; return; }
      del.disabled = true;
      try {
        for (const o of outfitsAll().filter(x => arr(x.itemIds).includes(it.id))) {
          await patchDoc("outfits", o.id, { itemIds: arr(o.itemIds).filter(x => x !== it.id), updatedAt: Date.now() });
        }
        await delDoc("items", it.id);
        if (it.photo && cap.assets && !assetInUse(it.photo, { exceptItem: it.id })) cap.assets.delete(it.photo).catch(() => {});
        closeSheet();
        toast("Deleted");
      } catch (e) { q("#ip-err").textContent = errText(e); del.disabled = false; }
    };
    const ret = q("#ip-retire");
    if (ret) ret.onclick = async () => {
      const back = it.status === "retired";
      try {
        await patchDoc("items", it.id, { status: back ? "active" : "retired", updatedAt: Date.now() });
        closeSheet();
        toast(back ? "Back in your closet" : "Retired. It won’t come up in picks.");
      } catch (e) { q("#ip-err").textContent = errText(e); }
    };
    return () => { if (fillCtl) fillCtl.abort(); };
  });
}

function huntRequest(h) {
  const p = S.profile || {}, sz = p.sizes || {}, a = p.analysis || {};
  const sizes = [sz.top && `top ${sz.top}`, sz.waist && `waist ${sz.waist}`, sz.inseam && `inseam ${sz.inseam}`, sz.shoe && `shoe ${sz.shoe}`].filter(Boolean).join(", ");
  const best = arr(a.bestColors).map(c => c && c.name).filter(Boolean).join(", ");
  const careful = arr(a.useCarefully).map(c => c && c.name).filter(Boolean).join(", ");
  return [
    `Run my Closet deal hunt: ${h.what}, for ${(OCC_LABEL[h.occasion] || "everyday").toLowerCase()}.`,
    budgetText(h) && `Budget: ${budgetText(h)}.`,
    sizes && `My sizes: ${sizes}.`,
    p.fit && `Fit I like: ${String(p.fit).toLowerCase()}.`,
    best && `Colors that suit me: ${best}.`,
    careful && `Colors to go easy on: ${careful}.`,
    p.stores && `Stores I like: ${p.stores}.`,
    h.notes && `Notes: ${h.notes}`,
    "Search current sales at reputable US stores, check quality (fabric, construction, reviews) and pick up to 5 of the best options in my budget and size.",
    `Then save them into my Closet app (the artifact called “Closet”) at database doc data/users/me/closet/hunts/${h.id}: set status to "done", add a one-line summary, and add results as a list of {title, store, url, price, wasPrice, why, quality}.`,
  ].filter(Boolean).join("\n");
}
async function copyHunt(id) {
  const d = S.hunts.get(id);
  if (!d) return;
  const text = huntRequest({ ...d, id });
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (_) {}
  if (!ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();

function normalizeAnalysis(r) {
  if (!r || typeof r !== "object") return null;
  const colors = (v, n) => arr(v).map(c => ({ name: str(c && c.name, 40), hex: safeHex(c && c.hex), why: str(c && c.why, 140) })).filter(c => c.name).slice(0, n);

  const tips = {};
  OCC.forEach(o => { const t = str(ot[o.id], 300); if (t) tips[o.id] = t; });
  const a = {
    summary: str(r.summary, 600),
    undertone: str(r.undertone, 20).toLowerCase(),
    contrast: str(r.contrast, 20).toLowerCase(),
    bestColors: colors(r.bestColors, 10),
    neutrals: colors(r.neutrals, 6),
    useCarefully: colors(r.useCarefully, 5),
    fit: arr(r.fit).map(f => ({ area: str(f && f.area, 40), advice: str(f && f.advice, 300) })).filter(f => f.area && f.advice).slice(0, 8),
    occasionTips: tips,
  };
  return a.summary || a.bestColors.length ? a : null;
}
async function analyze() {
  if (S.analysis.loading || !sampleOn() || !cap.imagesOK) return;

    const a = normalizeAnalysis(r);
    if (!a) throw { code: "invalid_json" };
    await saveProfile({ analysis: a, analyzedAt: Date.now() });
    S.analysis = { loading: false, error: "" };
  } catch (e) {
    S.analysis = { loading: false, error: e && e.code === "_photosgone" ? "Your photos couldn’t be loaded. Remove them and add them again." : errText(e) };
    noteSampleFailure(e);

window.addEventListener("hashchange", route);

async function boot() {
  try { const v = localStorage.getItem("closet.occ"); if (OCC_LABEL[v]) S.occ = v; } catch (_) {}
  route();
  const C = window.claude;
  if (!C || typeof C.use !== "function") { S.phase = "outside"; draw(); return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use("db"), C.use("user")]); } catch (_) {}
  cap.db = db; cap.user = user;
  if (!db || !user) { S.phase = "outside"; draw(); return; }
  let uid = null;
  try { uid = await user.id(); } catch (_) {}
  if (!uid) { S.phase = "signedout"; draw(); return; }
  S.uid = uid;
  closetRef = db.doc(`data/users/${uid}/closet`);
  subscribe();
  C.use("assets").then(a => { cap.assets = a; render(); }, () => {});
  C.use("sample").then(async s => {
    cap.sample = s;
    if (s) {
      try {
        const lim = await s.limits();
        cap.imagesOK = !!(lim && lim.images);
        cap.imageMax = (lim && lim.images && lim.images.maxCount) || 0;
      } catch (_) { cap.imagesOK = false; }
    }
    cap.sampleKnown = true;
    render();
  }, () => { cap.sampleKnown = true; render(); });
}
boot();
})();
</script>
</body>
</html>
